# OSS Kafka on EKS via the Strimzi operator (KRaft, no ZooKeeper) — the cheap
# alternative to MSK for load testing. In-cluster PLAINTEXT listener on :9092,
# so KAFKA_AUTH=none and KAFKA_BOOTSTRAP=trades-kafka-bootstrap.kafka.svc:9092.
#
# Install the operator once, then apply this:
#   kubectl create namespace kafka
#   kubectl apply -f 'https://strimzi.io/install/latest?namespace=kafka' -n kafka
#   kubectl apply -f infra/strimzi/kafka.yaml
#
# COST NOTE: 22 MB/s at 30k msg/s is trivial for Kafka; you pay for the pods, not
# throughput. For a pure single-run throughput test, drop replicas to 1 and set
# every *.replication.factor / min.insync to 1 and pin to ONE AZ — that removes
# cross-AZ replication traffic (the only real AWS Kafka cost). 3 replicas below
# is the HA default; keep all brokers + Flink in the same AZ during a test.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: trades
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim    # gp3; use `ephemeral` for a throwaway test cluster
        size: 100Gi
        class: gp3
        deleteClaim: true
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits:   {cpu: "2", memory: 4Gi}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: trades
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # For a single-AZ cheap test cluster, set these all to 1.
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: "true"     # Debezium creates app.public.* topics
  entityOperator:
    topicOperator: {}
    userOperator: {}                          # enables SCRAM users if KAFKA_AUTH=scram
