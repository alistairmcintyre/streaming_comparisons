# Namespaces + IRSA service accounts. Pods that touch S3/Glue/Athena run under the
# `lake` SA, annotated with the Terraform workload role — no static keys.
apiVersion: v1
kind: Namespace
metadata: { name: streaming }
---
apiVersion: v1
kind: Namespace
metadata: { name: fluss }
---
apiVersion: v1
kind: Namespace
metadata: { name: flink }
---
apiVersion: v1
kind: Namespace
metadata: { name: spark }
---
# The lake-access SA, created in each namespace that writes S3.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lake
  namespace: fluss
  annotations:
    eks.amazonaws.com/role-arn: ${WORKLOAD_ROLE_ARN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lake
  namespace: flink
  annotations:
    eks.amazonaws.com/role-arn: ${WORKLOAD_ROLE_ARN}
---
# Flink native-k8s: the JobManager (running as `lake`) creates/lists/deletes the
# TaskManager pods + its configmaps/services. Without this the JM crashes with
# "serviceaccount flink:lake cannot list resource pods".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: flink-native, namespace: flink }
rules:
  - apiGroups: [""]
    resources: [pods, configmaps, services]
    verbs: ["*"]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: ["*"]
  # Native-k8s JM reads its own Deployment as owner-ref when creating TaskManager
  # pods; without this, TM creation 403s → slot starvation → jobs stuck RESTARTING.
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: flink-native, namespace: flink }
subjects: [{ kind: ServiceAccount, name: lake, namespace: flink }]
roleRef: { kind: Role, name: flink-native, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lake
  namespace: spark
  annotations:
    eks.amazonaws.com/role-arn: ${WORKLOAD_ROLE_ARN}
---
# Shared pipeline config (bucket names, bootstraps, region) referenced by workloads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  namespace: fluss
data:
  AWS_REGION: "${AWS_REGION}"
  KAFKA_BOOTSTRAP: "trades-kafka-bootstrap.kafka.svc:9092"
  FLUSS_BOOTSTRAP: "fluss-coordinator.fluss.svc:9123"
  FLUSS_PAIMON_WAREHOUSE: "s3://${PAIMON_BUCKET}/fluss/paimon"
  FLUSS_REMOTE_DATA_DIR: "s3://${PAIMON_BUCKET}/fluss/remote-data"
  DATALAKE_FORMAT: "paimon"
  DEPLOY_ENV: "aws"
  KAFKA_AUTH: "none"
