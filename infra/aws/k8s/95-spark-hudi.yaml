# Spark Hudi streaming pipeline (Kafka → Hudi on S3) via the Spark Operator.
# Four long-running SparkApplications (bronze → silver → gold), mirroring the Delta
# and Iceberg manifests so the only difference between engines is the table format.
#
# MERGE_ON_READ with INLINE compaction (jobs/_shared/hudi_tables.py): Hudi defaults to
# COPY_ON_WRITE, which would make it look slower on writes and faster on reads for
# configuration reasons rather than engine ones. Iceberg gold is merge-on-read, Delta
# uses deletion vectors, Paimon is LSM. MOR keeps Hudi like-for-like, and is also the
# standard choice for streaming CDC ingest.
#
# NOTE when querying: a MOR table exposes _ro (read-optimised, base files only, STALE)
# and _rt (real-time, merges log files, CURRENT). Correctness checks must use _rt.
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata: { name: hudi-bronze-trades, namespace: spark }
spec:
  type: Python
  mode: cluster
  image: "${ECR_REGISTRY}/streaming-comparison/spark-hudi:latest"
  # :latest is mutable, without Always, nodes reuse a stale cached layer
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/jobs/bronze_trades.py"
  sparkVersion: "4.0.4"
  # BOUNDED RESTARTS. `type: Always` retries forever, so a deterministically-failing job
  # (bad schema, missing credential, unreadable table) crash-loops indefinitely while
  # still reporting as deployed, burning cluster and looking healthy. `OnFailure` with a
  # retry cap lets transient failures self-heal (each restart resumes from the streaming
  # checkpoint) but lets a permanent failure actually FAIL, where the PodCrashLooping
  # alert in 96-alerts.yaml can surface it.
  restartPolicy: { type: OnFailure, onFailureRetries: 10, onFailureRetryInterval: 10, onSubmissionFailureRetries: 5, onSubmissionFailureRetryInterval: 20 }
  sparkConf:
    # 8, not Spark's default of 200: these executors run 1 core, so 200 shuffle
    # partitions is 200 serialised tasks per stage, and AQE cannot coalesce them
    # because Spark disables AQE for streaming queries. Tidying rather than a fix,
    # measured at 3% against real S3.
    "spark.sql.shuffle.partitions": "8"
    # Keep the executor POD after it dies. Spark deletes it by default, so the one
    # place that records Reason=OOMKilled / Exit Code 137 is gone before
    # collect-diagnostics.sh runs -- which is exactly why ExecutorDeadException and
    # MetadataFetchFailedException came back from the last run unexplained.
    "spark.kubernetes.executor.deleteOnTermination": "false"
    # State store on DISK, not executor heap. silver.trades dedupes with
    # dropDuplicatesWithinWatermark over a 2h window, and the default
    # HDFSBackedStateStoreProvider holds every distinct trade_id in the window in JVM
    # heap, ~7.2M entries at 1k/s, against executors sized 4g. It also removes a
    # measurement asymmetry: the Flink engines already run state.backend=rocksdb, so
    # holding Spark's state on-heap would be a difference in the harness rather than
    # in the engines. Verified loading and surviving a restart by
    # tests/dedupe_state_test.py (27 rocksdb* metrics reported, state restored).
    "spark.sql.streaming.stateStore.providerClass": "org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider"
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
    "spark.sql.extensions": "org.apache.spark.sql.hudi.HoodieSparkSessionExtension"
    "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.hudi.catalog.HoodieCatalog"
    # Hudi opens its own handle on the metadata table and closes it. The S3A cache
    # returns the SAME S3AFileSystem for a given bucket and conf, so that close
    # shuts the credentials provider the rest of the JVM is still using, and every
    # later read dies with
    #   NoAuthWithAWSException ... WebIdentityTokenCredentialsProvider(): Connection pool shut down
    # on a job whose IRSA setup is correct and identical to jobs that work. Seen on
    # hudi-gold-open-positions (killed it, 11 attempts) and hudi-silver-trades (42
    # occurrences), always on .hoodie/metadata/ paths. Disabling the cache gives each
    # consumer its own filesystem so one component's close cannot break another's.
    #
    # VERIFIED on a live cluster, not reasoned about: hudi-silver-trades was climbing
    # an attempt a minute with 36 of these errors in the current driver log. Patched
    # in place, it held attempt 1 for over ten minutes with zero, and kept committing
    # (20260901213555915.deltacommit). hudi-bronze-trades likewise went to attempt 1.
    #
    # Gold needed one more thing. Once the credential failure was gone it surfaced
    #   IllegalArgumentException: Wrong FS: s3a://.../gold/open_positions/symbol=JPM,
    #   expected: file:///
    # from RollbackHelperV1 -> HoodieHadoopStorage.listDirectEntries, which asks for
    # FileSystem.get(conf) with no URI and so gets the DEFAULT filesystem. Setting
    # spark.hadoop.fs.defaultFS does NOT help: the driver picks it up and the executors
    # still resolve file:///, so Hudi is not using Spark's Hadoop conf on that path.
    # It only runs during a ROLLBACK, which is why silver (nothing pending) never hit
    # it and gold (a commit left inflight when credentials died) hit it every attempt.
    # It is NOT caused by this setting: reproduced off-cluster with the cache ON as
    # well (tests/hudi_rollback_repro.py). It only became visible here because the
    # credential failure had been killing the job before it reached a rollback.
    # Recovered by deleting the markers for the two genuinely incomplete instants,
    # after which gold held attempt 1 and its deltacommits started climbing again.
    # Note Hudi keeps .requested/.inflight next to COMPLETED instants too, so counting
    # those files overstates how wedged a table is: 18 markers, only 2 incomplete.
    # The credential fix is what stops this recurring, since a table only wedges when
    # a commit dies mid-flight. The rollback bug itself is still latent.
    "spark.hadoop.fs.s3a.impl.disable.cache": "true"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "software.amazon.awssdk.auth.credentials.DefaultCredentialsProvider"
  volumes:
    - { name: jobs, configMap: { name: spark-hudi-jobs } }
    - { name: shared, configMap: { name: spark-shared } }
  driver:
    serviceAccount: lake
    cores: 1
    # k8s CPU *request* only, spark.driver.cores stays 1. The driver just
    # coordinates microbatches (executors do the work), so a full core of
    # scheduling footprint is wasteful on a quota-capped cluster.
    coreRequest: "500m"
    memory: "2g"
    env:
      - { name: KAFKA_BROKERS, value: "trades-kafka-bootstrap.kafka.svc.cluster.local:9092" }
      - { name: CHECKPOINT_BASE, value: "s3a://${WAREHOUSE_BUCKET}/_chk" }
      - { name: HUDI_WAREHOUSE, value: "s3a://${WAREHOUSE_BUCKET}/hudi" }
      - { name: LATENCY_TOPIC, value: "pipeline_latency" }
      - { name: PYTHONPATH, value: "/opt/shared" }
    volumeMounts:
      - { name: jobs, mountPath: /opt/jobs }
      - { name: shared, mountPath: /opt/shared }
  executor:
    instances: 2
    cores: 2
    memory: "4g"
    serviceAccount: lake
    env:
      - { name: KAFKA_BROKERS, value: "trades-kafka-bootstrap.kafka.svc.cluster.local:9092" }
      - { name: CHECKPOINT_BASE, value: "s3a://${WAREHOUSE_BUCKET}/_chk" }
      - { name: HUDI_WAREHOUSE, value: "s3a://${WAREHOUSE_BUCKET}/hudi" }
      - { name: LATENCY_TOPIC, value: "pipeline_latency" }
      - { name: PYTHONPATH, value: "/opt/shared" }
    volumeMounts:
      - { name: jobs, mountPath: /opt/jobs }
      - { name: shared, mountPath: /opt/shared }
---
