# Karpenter provisions the workload nodes: spot with on-demand fallback, pinned to
# ONE AZ (no cross-AZ data cost), general-purpose. Bin-packs the pipeline pods and
# scales to zero when idle (before teardown the kill-switch terminates them anyway).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: workload
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]      # spot preferred, on-demand fallback
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["${NODE_AZ}"]             # single AZ
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "r"]                 # general purpose + memory (Fluss/Flink)
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
  limits:
    # MUST NOT exceed the account's EC2 vCPU quota, or Karpenter loops:
    # create NodeClaim -> RunInstances fails VcpuLimitExceeded -> delete -> retry.
    # eu-west-1 on-demand standard quota is 32 vCPU; the EKS managed nodegroup
    # already holds ~4, so cap Karpenter below the remainder. Raise this ONLY
    # together with a Service Quotas increase (L-1216C47A on-demand /
    # L-34B43A08 spot) — see AWS_OBJECTIVES/to-dos.
    cpu: "28"                                 # cap the run's blast radius
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: ${KARPENTER_NODE_ROLE}
  subnetSelectorTerms:
    - tags: { "karpenter.sh/discovery": "${CLUSTER_NAME}" }
  securityGroupSelectorTerms:
    - tags: { "karpenter.sh/discovery": "${CLUSTER_NAME}" }
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  tags:
    Project: streaming-comparison
    RunId: ${RUN_ID}
