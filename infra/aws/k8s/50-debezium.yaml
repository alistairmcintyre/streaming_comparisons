# Debezium CDC via Strimzi KafkaConnect. spec.build adds the Postgres connector and
# pushes the built image to ECR (the Connect build pod needs ECR push — via the node
# role or a push secret). Two connectors = two replication slots (trades, accounts).
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: debezium
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.2.0
  replicas: 1
  bootstrapServers: trades-kafka-bootstrap.kafka.svc.cluster.local:9092
  # Strimzi v1 promoted these from config dotted-keys to required top-level fields.
  groupId: debezium
  offsetStorageTopic: debezium-offsets
  configStorageTopic: debezium-configs
  statusStorageTopic: debezium-status
  build:
    output:
      type: docker
      image: ${ECR_REGISTRY}/streaming-comparison/kafka-connect:latest
      # Node role has ECR pull only; the build pod needs push creds. `ecr-push`
      # is a docker-registry secret the workflow creates from an ECR token.
      pushSecret: ecr-push
    plugins:
      - name: debezium-postgres
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/2.7.4.Final/debezium-connector-postgres-2.7.4.Final-plugin.tar.gz
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    # Connect's JsonConverter defaults to schemas.enable=TRUE, which wraps every
    # record as {"schema":{...},"payload":{...}}. Every consumer here expects the
    # payload at the top level: the Spark jobs parse op/after directly, and Flink's
    # debezium-json format defaults to schema-include=false. With the default on,
    # `after` parses as null, every row is filtered out, and the pipelines commit
    # empty batches forever. docker-compose already sets these (VALUE_CONVERTER_
    # SCHEMAS_ENABLE=false) — this is the local→AWS gap.
    # Dead-letter queue. Kafka Connect is the ONE layer here with real DLQ support:
    # a record that cannot be converted/serialised goes to `debezium-dlq` with the
    # failure reason in its headers, instead of killing the task or vanishing.
    # errors.tolerance=all applies to conversion/transform errors only — genuine
    # connector failures (lost DB connection, invalid slot) still fail loudly.
    errors.tolerance: all
    errors.deadletterqueue.topic.name: debezium-dlq
    errors.deadletterqueue.topic.replication.factor: 3
    errors.deadletterqueue.context.headers.enable: true
    errors.log.enable: true
    errors.log.include.messages: false   # payloads may contain PII; headers carry the cause
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits:   { cpu: "2", memory: 2Gi }
# ONE connector captures both tables. Debezium requires topic.prefix to be UNIQUE
# per connector (it namespaces JMX MBeans + offsets), but both tables must share
# prefix `app` to yield the topic names the downstream jobs subscribe to
# (app.public.trades / app.public.accounts). Two connectors with prefix `app`
# therefore collide on JMX and the second one stalls — so a single connector with
# table.include.list = both tables is the correct design (one slot, one publication).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: pg-app
  namespace: kafka
  labels: { strimzi.io/cluster: debezium }
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: postgres.streaming.svc
    database.port: 5432
    database.user: app
    database.password: ${POSTGRES_PASSWORD}
    database.dbname: appdb
    topic.prefix: app
    plugin.name: pgoutput
    slot.name: dbz_app
    publication.name: dbz_pub_app
    publication.autocreate.mode: filtered
    table.include.list: public.trades,public.accounts
    max.batch.size: 8192
    # Debezium requires max.queue.size > max.batch.size (default queue is 8192).
    max.queue.size: 32768
    # `price` is NUMERIC(12,4) in Postgres — money, so it must stay exact.
    # `precise` (the default) emits base64 Connect Decimal bytes, which the JSON
    # consumers cannot decode; `double` parses but is LOSSY, and the error compounds
    # in net_notional = SUM(quantity * price) over millions of rows. `string` keeps
    # the exact decimal and the jobs cast it to DECIMAL(12,4).
    decimal.handling.mode: string
    # Broker auto-create is OFF (30-kafka.yaml), so Connect must be able to create the
    # topics it routes to. The declared topics in 31-kafka-topics.yaml already exist and
    # Connect leaves those alone; this is the safety net for a table added to
    # table.include.list without a matching KafkaTopic — it gets bounded retention
    # rather than failing the task or inheriting no bound at all.
    topic.creation.default.replication.factor: 3
    topic.creation.default.partitions: 3
    topic.creation.default.retention.ms: 604800000
    topic.creation.default.retention.bytes: 5368709120
    topic.creation.default.cleanup.policy: delete
