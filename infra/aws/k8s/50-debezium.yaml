# Debezium CDC via Strimzi KafkaConnect. spec.build adds the Postgres connector and
# pushes the built image to ECR (the Connect build pod needs ECR push — via the node
# role or a push secret). Two connectors = two replication slots (trades, accounts).
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: debezium
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.2.0
  replicas: 1
  bootstrapServers: trades-kafka-bootstrap.kafka.svc.cluster.local:9092
  # Strimzi v1 promoted these from config dotted-keys to required top-level fields.
  groupId: debezium
  offsetStorageTopic: debezium-offsets
  configStorageTopic: debezium-configs
  statusStorageTopic: debezium-status
  build:
    output:
      type: docker
      image: ${ECR_REGISTRY}/streaming-comparison/kafka-connect:latest
      # Node role has ECR pull only; the build pod needs push creds. `ecr-push`
      # is a docker-registry secret the workflow creates from an ECR token.
      pushSecret: ecr-push
    plugins:
      - name: debezium-postgres
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/2.7.4.Final/debezium-connector-postgres-2.7.4.Final-plugin.tar.gz
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    # Connect's JsonConverter defaults to schemas.enable=TRUE, which wraps every
    # record as {"schema":{...},"payload":{...}}. Every consumer here expects the
    # payload at the top level: the Spark jobs parse op/after directly, and Flink's
    # debezium-json format defaults to schema-include=false. With the default on,
    # `after` parses as null, every row is filtered out, and the pipelines commit
    # empty batches forever. docker-compose already sets these (VALUE_CONVERTER_
    # SCHEMAS_ENABLE=false) — this is the local→AWS gap.
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits:   { cpu: "2", memory: 2Gi }
# ONE connector captures both tables. Debezium requires topic.prefix to be UNIQUE
# per connector (it namespaces JMX MBeans + offsets), but both tables must share
# prefix `app` to yield the topic names the downstream jobs subscribe to
# (app.public.trades / app.public.accounts). Two connectors with prefix `app`
# therefore collide on JMX and the second one stalls — so a single connector with
# table.include.list = both tables is the correct design (one slot, one publication).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: pg-app
  namespace: kafka
  labels: { strimzi.io/cluster: debezium }
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: postgres.streaming.svc
    database.port: 5432
    database.user: app
    database.password: ${POSTGRES_PASSWORD}
    database.dbname: appdb
    topic.prefix: app
    plugin.name: pgoutput
    slot.name: dbz_app
    publication.name: dbz_pub_app
    publication.autocreate.mode: filtered
    table.include.list: public.trades,public.accounts
    max.batch.size: 8192
    # Debezium requires max.queue.size > max.batch.size (default queue is 8192).
    max.queue.size: 32768
    # `price` is NUMERIC in Postgres. Debezium's default decimal.handling.mode=precise
    # emits it as base64-encoded bytes (Connect Decimal), but every job schema types
    # price as DoubleType, so it would parse as NULL and silently poison the gold
    # aggregates (net_notional = quantity * price). Emit plain doubles instead.
    decimal.handling.mode: double
