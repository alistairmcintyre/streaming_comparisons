# Flink Paimon streaming pipeline (Kafka → Paimon on S3, Iceberg view via Glue), 
# Flink-operator session cluster + submitter (renders jobs/flink-paimon SQL for
# DEPLOY_ENV=aws → hive-catalog/Glue). SQL from a ConfigMap:
#   kubectl -n flink create configmap paimon-sql --from-file=jobs/flink-paimon/
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata: { name: flink-paimon, namespace: flink }
spec:
  image: "${ECR_REGISTRY}/streaming-comparison/flink-paimon:latest"
  flinkVersion: v1_20
  serviceAccount: lake
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "6"
    # HIGH AVAILABILITY. This is the fix that matters. These are SESSION clusters, and
    # without HA a JobManager restart loses every submitted job PERMANENTLY, they do
    # not come back, and the submitter Job has already completed so nothing resubmits
    # them. That is exactly what happened on the first live run: the operator recreated
    # the JM and both engines silently went to zero jobs while the pods looked healthy.
    # With Kubernetes HA the JM recovers its job graphs from the HA metadata plus the
    # last checkpoint, so a restart costs seconds instead of the whole pipeline.
    high-availability.type: kubernetes
    # No kubernetes.cluster-id here. The operator sets it from metadata.name and the
    # validation webhook REJECTS the deployment outright if you specify it:
    #   Forbidden Flink config key: kubernetes.cluster-id
    # HA does not need it, type + storageDir is the whole contract.
    high-availability.storageDir: "s3://${PAIMON_BUCKET}/_flink_ha/paimon"
    # RECOVERY + UPGRADE PATH. These are SESSION clusters (many SQL jobs on one
    # cluster), so the operator's `job.upgradeMode: savepoint` does not apply, that is
    # an Application-mode feature. The equivalent for this topology is: keep checkpoints
    # when a job is cancelled, retain enough of them to roll back to, and give savepoints
    # a home so a job can be stopped-with-savepoint and resumed via the REST API.
    # Without RETAIN_ON_CANCELLATION a cancelled job's checkpoints are DELETED, so any
    # deliberate job change means replaying from the source, over months, unacceptable.
    execution.checkpointing.externalized-checkpoint-retention: "RETAIN_ON_CANCELLATION"
    state.checkpoints.num-retained: "3"
    state.savepoints.dir: "s3://${PAIMON_BUCKET}/_flink_savepoints/paimon"
    # Tolerate transient checkpoint failures (S3 5xx) instead of failing the job on the
    # first one; FlinkCheckpointsFailing in 96-alerts.yaml catches a persistent problem.
    execution.checkpointing.tolerable-failed-checkpoints: "3"
    # Bounded restart strategy: back off rather than hot-loop, and give up if the job is
    # failing persistently so it surfaces instead of restarting silently forever.
    restart-strategy.type: "exponential-delay"
    restart-strategy.exponential-delay.initial-backoff: "10 s"
    restart-strategy.exponential-delay.max-backoff: "2 min"
    restart-strategy.exponential-delay.reset-backoff-threshold: "10 min"
    # Prometheus metrics reporter. 94-observability.yaml has a PodMonitor scraping
    # `port: metrics` on these pods, but WITHOUT this block no reporter is started and
    # no metrics port is opened, so the PodMonitor has been scraping nothing and the
    # Flink half of the dashboard has been empty on every run to date. The
    # metrics-prometheus plugin already ships in the image; it just was not enabled.
    metrics.reporter.prom.factory.class: "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
    metrics.reporter.prom.port: "9249"
    # paimon-s3 needs static keys (no IRSA), from SSM via envsubst at deploy.
    s3.region: "${AWS_REGION}"
    s3.access-key: "${S3_ACCESS_KEY}"
    s3.secret-key: "${S3_SECRET_KEY}"
    state.backend: rocksdb
    execution.checkpointing.interval: "10s"
  # The metrics reporter binds 9249, but the Flink operator does not add it to the
  # container spec, the JM pods declare only 8081/6123/6124. A PodMonitor cannot select
  # a port the pod never declares, so it produced zero targets and every flink_* metric
  # was absent (verified live: Prometheus had 78 healthy targets and not one was Flink).
  # Declaring it here, named, is what makes the reporter scrapeable.
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          ports:
            - { containerPort: 9249, name: metrics }
  jobManager: { resource: { memory: "1600m", cpu: 1 } }
  taskManager: { resource: { memory: "4096m", cpu: 2 } }
  mode: native
---
apiVersion: batch/v1
kind: Job
metadata: { name: paimon-submitter, namespace: flink }
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: lake
      restartPolicy: OnFailure
      containers:
        - name: submitter
          image: "${ECR_REGISTRY}/streaming-comparison/flink-paimon:latest"
          command: ["/bin/bash", "/opt/flink-jobs/submit.sh"]
          env:
            - { name: DEPLOY_ENV, value: "aws" }
            - { name: KAFKA_AUTH, value: "none" }
            - { name: AWS_REGION, value: "${AWS_REGION}" }
            - { name: JOBMANAGER_RPC_ADDRESS, value: "flink-paimon-rest.flink.svc" }
            - { name: FLINK_JOBMANAGER_PORT, value: "8081" }
            - { name: KAFKA_BOOTSTRAP, value: "trades-kafka-bootstrap.kafka.svc.cluster.local:9092" }
            - { name: PAIMON_WAREHOUSE, value: "s3://${PAIMON_BUCKET}/paimon" }
            # SQL sets state.checkpoints.dir = ${FLINK_CHECKPOINT_BASE}/<job>/, unset,
            # it renders a scheme-less path AND every INSERT fails with
            # "The scheme (hdfs://, file://, etc) is null".
            - { name: FLINK_CHECKPOINT_BASE, value: "s3://${PAIMON_BUCKET}/_flink_chk" }
            - { name: PAIMON_ICEBERG_STORAGE, value: "hive-catalog" }
            - { name: PAIMON_FULL_COMPACT_INTERVAL, value: "1min" }
            - { name: S3_ACCESS_KEY, value: "${S3_ACCESS_KEY}" }
            - { name: S3_SECRET_KEY, value: "${S3_SECRET_KEY}" }
          volumeMounts: [{ name: sql, mountPath: /opt/flink-jobs }]
      volumes:
        - { name: sql, configMap: { name: paimon-sql } }
