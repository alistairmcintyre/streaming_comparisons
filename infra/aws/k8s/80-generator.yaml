# Trades generator → Postgres (the CDC source). Rate is the load-test knob
# (TRADES_PER_SEC): start 1k, then 10k. The generator image is lean (python +
# psycopg2 only); the source is delivered via the `generator-src` ConfigMap
# (created by the workflow from generators/*.py) and mounted at /app — same
# pattern as the Spark job ConfigMaps.
apiVersion: apps/v1
kind: Deployment
metadata: { name: generator-trades, namespace: streaming }
spec:
  replicas: 1
  selector: { matchLabels: { app: generator-trades } }
  template:
    metadata: { labels: { app: generator-trades } }
    spec:
      # Disable K8s service-link env injection: the `postgres` Service would
      # otherwise inject POSTGRES_PORT=tcp://<ip>:5432, which common.py's
      # int(POSTGRES_PORT) cannot parse. We set POSTGRES_* explicitly below.
      enableServiceLinks: false
      volumes:
        - name: src
          configMap: { name: generator-src }
      containers:
        - name: generator
          image: ${ECR_REGISTRY}/streaming-comparison/generator:latest
          workingDir: /app
          command: ["python", "gen_trades.py"]
          volumeMounts:
            - { name: src, mountPath: /app }
          env:
            # common.py reads POSTGRES_* (NOT libpq PG*); names must match exactly.
            - { name: POSTGRES_HOST, value: postgres.streaming.svc }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: app }
            - { name: POSTGRES_DB, value: appdb }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } } }
            - { name: TRADES_PER_SEC, value: "${TRADES_PER_SEC}" }
            - { name: TRADES_BATCH_SIZE, value: "500" }
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits:   { cpu: "2", memory: 1Gi }
---
# Accounts dimension generator (SCD1): seeds 1000 accounts, then trickles slow
# changes. Without it the `accounts` table stays empty, Debezium never creates
# app.public.accounts, and every silver-accounts pipeline (Paimon/Iceberg/Delta)
# fails on a missing Kafka topic — while trades reference account_id 1..1000.
apiVersion: apps/v1
kind: Deployment
metadata: { name: generator-accounts, namespace: streaming }
spec:
  replicas: 1
  selector: { matchLabels: { app: generator-accounts } }
  template:
    metadata: { labels: { app: generator-accounts } }
    spec:
      enableServiceLinks: false
      volumes:
        - name: src
          configMap: { name: generator-src }
      containers:
        - name: generator
          image: ${ECR_REGISTRY}/streaming-comparison/generator:latest
          workingDir: /app
          command: ["python", "gen_accounts.py"]
          volumeMounts:
            - { name: src, mountPath: /app }
          env:
            - { name: POSTGRES_HOST, value: postgres.streaming.svc }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_USER, value: app }
            - { name: POSTGRES_DB, value: appdb }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } } }
            - { name: SEED_ACCOUNTS, value: "1000" }
            - { name: MAX_ACCOUNT_ID, value: "1000" }
            - { name: EVENTS_PER_SEC, value: "5" }   # dimension: deliberately slow
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits:   { cpu: "500m", memory: 512Mi }
