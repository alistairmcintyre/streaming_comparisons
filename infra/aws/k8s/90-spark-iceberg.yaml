# Spark Iceberg streaming pipeline (Kafka → Iceberg on S3, Glue catalog) via the
# Spark Operator. Four long-running SparkApplications (bronze → silver → gold). Each
# job self-provisions its tables (ensure_all → CREATE IF NOT EXISTS, see
# jobs/_shared/iceberg_tables.py), so there is no ordering dependency. Jobs + shared
# modules come from ConfigMaps. Catalog `rest` is bound to Glue on AWS; S3 via IRSA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lake
  namespace: spark
  annotations: { eks.amazonaws.com/role-arn: "${WORKLOAD_ROLE_ARN}" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: spark-driver, namespace: spark }
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: spark-driver, namespace: spark }
subjects: [{ kind: ServiceAccount, name: lake, namespace: spark }]
roleRef: { kind: Role, name: spark-driver, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata: { name: iceberg-bronze-trades, namespace: spark }
spec:
  type: Python
  mode: cluster
  image: "${ECR_REGISTRY}/streaming-comparison/spark-iceberg:latest"
  mainApplicationFile: "local:///opt/jobs/bronze_trades.py"
  sparkVersion: "3.5.1"
  restartPolicy: { type: Always, onFailureRetryInterval: 10, onSubmissionFailureRetryInterval: 20 }
  sparkConf:
    "spark.sql.catalog.rest": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.rest.catalog-impl": "org.apache.iceberg.aws.glue.GlueCatalog"
    "spark.sql.catalog.rest.warehouse": "s3://${WAREHOUSE_BUCKET}/iceberg"
    "spark.sql.catalog.rest.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
  volumes:
    - { name: jobs, configMap: { name: spark-iceberg-jobs } }
    - { name: shared, configMap: { name: spark-shared } }
  driver:
    serviceAccount: lake
    cores: 1
    memory: "2g"
    env:
      - { name: KAFKA_BOOTSTRAP, value: "trades-kafka-bootstrap.kafka.svc:9092" }
      - { name: CHECKPOINT_BASE, value: "s3a://${WAREHOUSE_BUCKET}/_chk" }
      - { name: ICEBERG_CATALOG, value: "rest" }
      - { name: PYTHONPATH, value: "/opt/shared" }
    volumeMounts:
      - { name: jobs, mountPath: /opt/jobs }
      - { name: shared, mountPath: /opt/shared }
  executor:
    instances: 2
    cores: 2
    memory: "4g"
    serviceAccount: lake
    env:
      - { name: KAFKA_BOOTSTRAP, value: "trades-kafka-bootstrap.kafka.svc:9092" }
      - { name: CHECKPOINT_BASE, value: "s3a://${WAREHOUSE_BUCKET}/_chk" }
      - { name: ICEBERG_CATALOG, value: "rest" }
      - { name: PYTHONPATH, value: "/opt/shared" }
    volumeMounts:
      - { name: jobs, mountPath: /opt/jobs }
      - { name: shared, mountPath: /opt/shared }
---
