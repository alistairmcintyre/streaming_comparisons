# Spark Delta streaming pipeline (Kafka → Delta on S3). Four long-running
# SparkApplications; each self-provisions its tables (ensure_all → createIfNotExists,
# jobs/_shared/delta_tables.py) so there's no ordering dependency. COMPACTION is
# IN-pipeline (Optimized Writes + Auto Compaction via table props AND session confs)
# — mirrors Paimon self-compaction; only VACUUM is a separate job (93-maintenance.yaml).
# S3 via IRSA. NOTE: no S3DynamoDBLogStore — each table has exactly ONE streaming
# writer and VACUUM does not write commits, so the default single-driver log store
# is correct. The S3DynamoDBLogStore class also needs the AWS SDK **v1**
# (com.amazonaws.services.dynamodbv2), which this SDK-v2 image does not carry.
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata: { name: delta-bronze-trades, namespace: spark }
spec:
  type: Python
  mode: cluster
  image: "${ECR_REGISTRY}/streaming-comparison/spark-delta:latest"
  # :latest is mutable — without Always, nodes reuse a stale cached layer
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/jobs/bronze_trades.py"
  sparkVersion: "3.5.1"
  restartPolicy: { type: Always, onFailureRetryInterval: 10, onSubmissionFailureRetryInterval: 20 }
  sparkConf:
    "spark.sql.extensions": "io.delta.sql.DeltaSparkSessionExtension"
    "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    "spark.databricks.delta.optimizeWrite.enabled": "true"
    "spark.databricks.delta.autoCompact.enabled": "true"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "software.amazon.awssdk.auth.credentials.DefaultCredentialsProvider"
  volumes:
    - { name: jobs, configMap: { name: spark-delta-jobs } }
    - { name: shared, configMap: { name: spark-shared } }
  driver:
    serviceAccount: lake
    cores: 1
    memory: "2g"
    env:
      - { name: KAFKA_BROKERS, value: "trades-kafka-bootstrap.kafka.svc.cluster.local:9092" }
      - { name: DELTA_WAREHOUSE, value: "s3a://${WAREHOUSE_BUCKET}/delta" }
      - { name: CHECKPOINT_BASE, value: "s3a://${WAREHOUSE_BUCKET}/_chk" }
      - { name: PYTHONPATH, value: "/opt/shared" }
    volumeMounts:
      - { name: jobs, mountPath: /opt/jobs }
      - { name: shared, mountPath: /opt/shared }
  executor:
    instances: 1
    cores: 1
    memory: "2g"
    serviceAccount: lake
    env:
      - { name: KAFKA_BROKERS, value: "trades-kafka-bootstrap.kafka.svc.cluster.local:9092" }
      - { name: DELTA_WAREHOUSE, value: "s3a://${WAREHOUSE_BUCKET}/delta" }
      - { name: CHECKPOINT_BASE, value: "s3a://${WAREHOUSE_BUCKET}/_chk" }
      - { name: PYTHONPATH, value: "/opt/shared" }
    volumeMounts:
      - { name: jobs, mountPath: /opt/jobs }
      - { name: shared, mountPath: /opt/shared }
---
