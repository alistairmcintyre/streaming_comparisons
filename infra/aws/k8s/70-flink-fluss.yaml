# Flink for the Fluss pipeline via the Flink Kubernetes Operator: a session cluster
# (our fluss-flink image) + a submitter Job that renders the SQL for DEPLOY_ENV=aws
# and runs create/bronze/gold + the tiering job (submit.sh). The SQL comes from a
# ConfigMap the workflow builds from jobs/flink-fluss/:
#   kubectl -n flink create configmap fluss-sql --from-file=jobs/flink-fluss/
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata: { name: fluss-flink, namespace: flink }
spec:
  image: ${ECR_REGISTRY}/streaming-comparison/fluss-flink:latest
  flinkVersion: v1_20
  serviceAccount: lake
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    # RECOVERY + UPGRADE PATH. These are SESSION clusters (many SQL jobs on one
    # cluster), so the operator's `job.upgradeMode: savepoint` does not apply — that is
    # an Application-mode feature. The equivalent for this topology is: keep checkpoints
    # when a job is cancelled, retain enough of them to roll back to, and give savepoints
    # a home so a job can be stopped-with-savepoint and resumed via the REST API.
    # Without RETAIN_ON_CANCELLATION a cancelled job's checkpoints are DELETED, so any
    # deliberate job change means replaying from the source — over months, unacceptable.
    execution.checkpointing.externalized-checkpoint-retention: "RETAIN_ON_CANCELLATION"
    state.checkpoints.num-retained: "3"
    state.savepoints.dir: "s3://${PAIMON_BUCKET}/_flink_savepoints/fluss"
    # Tolerate transient checkpoint failures (S3 5xx) instead of failing the job on the
    # first one; FlinkCheckpointsFailing in 96-alerts.yaml catches a persistent problem.
    execution.checkpointing.tolerable-failed-checkpoints: "3"
    # Bounded restart strategy: back off rather than hot-loop, and give up if the job is
    # failing persistently so it surfaces instead of restarting silently forever.
    restart-strategy.type: "exponential-delay"
    restart-strategy.exponential-delay.initial-backoff: "10 s"
    restart-strategy.exponential-delay.max-backoff: "2 min"
    restart-strategy.exponential-delay.reset-backoff-threshold: "10 min"
    # Prometheus metrics reporter. 94-observability.yaml has a PodMonitor scraping
    # `port: metrics` on these pods, but WITHOUT this block no reporter is started and
    # no metrics port is opened — so the PodMonitor has been scraping nothing and the
    # Flink half of the dashboard has been empty on every run to date. The
    # metrics-prometheus plugin already ships in the image; it just was not enabled.
    metrics.reporter.prom.factory.class: "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
    metrics.reporter.prom.port: "9249"
    # datalake S3 for the Fluss source's hybrid lake read. paimon-s3 needs static
    # keys (no IRSA) — from SSM via envsubst at deploy (see workflow).
    s3.region: "${AWS_REGION}"
    s3.access-key: "${S3_ACCESS_KEY}"
    s3.secret-key: "${S3_SECRET_KEY}"
    # Java 17 opens for the tiering DataStream job
    env.java.opts.all: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED"
  jobManager:
    resource: { memory: "1600m", cpu: 1 }
  taskManager:
    resource: { memory: "4096m", cpu: 2 } # ≥4G heap — quickstart default OOMs
  # no `job:` block → SESSION cluster; the submitter below feeds it jobs.
  mode: native
  podTemplate:
    spec:
      volumes:
        - { name: remote, persistentVolumeClaim: { claimName: fluss-remote } }
      containers:
        - name: flink-main-container
          volumeMounts: [{ name: remote, mountPath: /fluss-remote-data }]
          # The metrics reporter binds 9249, but the Flink operator does NOT add it to
          # the container spec — JM pods declare only 8081/6123/6124. A PodMonitor
          # cannot select a port the pod never declares, so it produced ZERO targets
          # and every flink_* metric was absent (verified live: Prometheus had 78
          # healthy targets, not one of them Flink). Declaring it named makes the
          # reporter scrapeable.
          ports:
            - { containerPort: 9249, name: metrics }
---
# Submitter: renders SQL for aws + submits create/bronze/gold + starts tiering.
apiVersion: batch/v1
kind: Job
metadata: { name: fluss-submitter, namespace: flink }
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: lake
      restartPolicy: OnFailure
      containers:
        - name: submitter
          image: ${ECR_REGISTRY}/streaming-comparison/fluss-flink:latest
          command: ["/bin/bash", "/opt/sql/submit.sh"]
          env:
            - { name: DEPLOY_ENV, value: "aws" }
            - { name: KAFKA_AUTH, value: "none" }
            - { name: AWS_REGION, value: "${AWS_REGION}" }
            - { name: JOBMANAGER_RPC_ADDRESS, value: "fluss-flink-rest.flink.svc" }
            - { name: FLINK_JOBMANAGER_PORT, value: "8081" }
            - { name: FLUSS_BOOTSTRAP, value: "fluss-coordinator.fluss.svc:9123" }
            - { name: KAFKA_BOOTSTRAP, value: "trades-kafka-bootstrap.kafka.svc.cluster.local:9092" }
            - { name: FLUSS_PAIMON_WAREHOUSE, value: "s3://${PAIMON_BUCKET}/fluss/paimon" }
            - { name: DATALAKE_FORMAT, value: "paimon" }
            - { name: S3_ACCESS_KEY, value: "${S3_ACCESS_KEY}" }
            - { name: S3_SECRET_KEY, value: "${S3_SECRET_KEY}" }
            - { name: S3_PATH_STYLE, value: "false" }
          volumeMounts: [{ name: sql, mountPath: /opt/sql }]
      volumes:
        - { name: sql, configMap: { name: fluss-sql } }
