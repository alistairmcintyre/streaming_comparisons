# Observability: the latency-exporter (Kafka pipeline_latency → Prometheus histogram
# + S3 Parquet) + scrape configs. kube-prometheus-stack (Prometheus operator + Grafana)
# is installed by Helm (see README). Grafana reads Prometheus — never Kafka directly.
# NOTE: the pipeline_latency topic is declared in 31-kafka-topics.yaml, with
# retention, alongside every other topic. Declaring it twice makes the Strimzi
# topic operator reconcile two resources onto one topic and flap between them.
apiVersion: apps/v1
kind: Deployment
metadata: { name: latency-exporter, namespace: streaming }
spec:
  replicas: 1
  selector: { matchLabels: { app: latency-exporter } }
  template:
    metadata: { labels: { app: latency-exporter } }
    spec:
      serviceAccountName: lake        # IRSA — S3 Parquet flush
      containers:
        - name: exporter
          image: "${ECR_REGISTRY}/streaming-comparison/latency-exporter:latest"
          ports: [{ name: metrics, containerPort: 8000 }]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "trades-kafka-bootstrap.kafka.svc.cluster.local:9092" }
            - { name: LATENCY_TOPIC, value: "pipeline_latency" }
            - { name: RUN_ID, value: "${RUN_ID}" }
            - { name: S3_BENCHMARK_PREFIX, value: "s3://${WAREHOUSE_BUCKET}/benchmarks/${RUN_ID}/latency" }
          resources: { requests: { cpu: "250m", memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: latency-exporter
  namespace: streaming
  labels: { app: latency-exporter }
spec:
  selector: { app: latency-exporter }
  ports: [{ name: metrics, port: 8000 }]
---
# Scrape the exporter (needs the Prometheus operator CRDs from kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: latency-exporter
  namespace: streaming
  labels: { release: kube-prometheus-stack }
spec:
  selector: { matchLabels: { app: latency-exporter } }
  endpoints: [{ port: metrics, interval: 5s }]
---
# Flink operator exposes metrics on the JM/TM; scrape both FlinkDeployments.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flink
  namespace: flink
  labels: { release: kube-prometheus-stack }
spec:
  selector: { matchLabels: { type: flink-native-kubernetes } }
  # targetPort, not port: the Flink operator does not name the reporter's container
  # port, so a name-based selector matches nothing. 9249 is metrics.reporter.prom.port.
  podMetricsEndpoints: [{ targetPort: 9249, interval: 5s }]
---
# Scrape the Strimzi Kafka Exporter (consumer lag + topic offsets). Strimzi labels the
# exporter pod strimzi.io/kind=KafkaExporter and serves metrics on 9404.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  namespace: kafka
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels:
      # The exporter pod carries strimzi.io/kind=Kafka (the CR kind that OWNS it), NOT
      # KafkaExporter — verified live: strimzi.io/component-type=kafka-exporter is the
      # label that identifies it. The wrong selector matched nothing, so
      # kafka_consumergroup_lag had zero series and every lag alert was inert while
      # looking perfectly healthy.
      strimzi.io/component-type: kafka-exporter
      strimzi.io/cluster: trades
  podMetricsEndpoints: [{ targetPort: 9404, interval: 15s }]
