# Observability: the latency-exporter (Kafka pipeline_latency → Prometheus histogram
# + S3 Parquet) + scrape configs. kube-prometheus-stack (Prometheus operator + Grafana)
# is installed by Helm (see README). Grafana reads Prometheus — never Kafka directly.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: pipeline-latency
  namespace: kafka
  labels: { strimzi.io/cluster: trades }
spec:
  topicName: pipeline_latency
  partitions: 6
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: latency-exporter, namespace: streaming }
spec:
  replicas: 1
  selector: { matchLabels: { app: latency-exporter } }
  template:
    metadata: { labels: { app: latency-exporter } }
    spec:
      serviceAccountName: lake        # IRSA — S3 Parquet flush
      containers:
        - name: exporter
          image: "${ECR_REGISTRY}/streaming-comparison/latency-exporter:latest"
          ports: [{ name: metrics, containerPort: 8000 }]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "trades-kafka-bootstrap.kafka.svc:9092" }
            - { name: LATENCY_TOPIC, value: "pipeline_latency" }
            - { name: RUN_ID, value: "${RUN_ID}" }
            - { name: S3_BENCHMARK_PREFIX, value: "s3://${WAREHOUSE_BUCKET}/benchmarks/${RUN_ID}/latency" }
          resources: { requests: { cpu: "250m", memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: latency-exporter
  namespace: streaming
  labels: { app: latency-exporter }
spec:
  selector: { app: latency-exporter }
  ports: [{ name: metrics, port: 8000 }]
---
# Scrape the exporter (needs the Prometheus operator CRDs from kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: latency-exporter
  namespace: streaming
  labels: { release: kube-prometheus-stack }
spec:
  selector: { matchLabels: { app: latency-exporter } }
  endpoints: [{ port: metrics, interval: 5s }]
---
# Flink operator exposes metrics on the JM/TM; scrape both FlinkDeployments.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flink
  namespace: flink
  labels: { release: kube-prometheus-stack }
spec:
  selector: { matchLabels: { type: flink-native-kubernetes } }
  podMetricsEndpoints: [{ port: metrics, interval: 5s }]
