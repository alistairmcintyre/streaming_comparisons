name: EKS ephemeral run

# Cost-capped load-test run: create → deploy → run → snapshot → destroy.
# The AWS-side EventBridge kill switch (Terraform) tears the cluster down at
# now+2.5h regardless of this workflow, so a hung/failed job never leaks cost.

on:
  workflow_dispatch:
    inputs:
      trades_per_sec:
        description: "Generator rate"
        type: choice
        options: ["1000", "10000"]
        default: "1000"
      run_minutes:
        description: "Minutes to run before snapshot+destroy"
        default: "120"
      destroy_mode:
        description: "When to terraform destroy (EventBridge 2.5h kill-switch always backstops)"
        type: choice
        options: ["always", "on-success", "never"]
        # ALWAYS. `on-success` kept a failed run's cluster alive for debugging, which
        # cost two idle clusters in one day — a run that fails at minute 10 then bills
        # until the 2.5h kill switch. Safe to destroy now only because the diagnostics
        # bundle below is collected FIRST: the evidence that made the failures
        # debuggable (submitter logs, JM logs, operator events, prometheus targets)
        # is uploaded as a workflow artifact before anything is torn down.
        default: "always"
      run_id:
        description: "Stable id → shared state/names so re-apply is INCREMENTAL"
        default: "iter"
      clean_lake:
        description: "Wipe lake tables + streaming checkpoints before the run (fresh benchmark; leaves tfstate/teardown/ECR untouched)"
        type: boolean
        default: true
      wire_format:
        description: "CDC serialization under test — labels the results so JSON and Avro sets stay comparable (Objective 5)"
        type: choice
        options: ["json", "avro"]
        default: "json"

permissions:
  id-token: write      # OIDC
  contents: read

env:
  AWS_REGION: eu-west-1
  ACCOUNT: "167217327348"
  PROJECT: streaming-comparison
  PAIMON_BUCKET: streaming-comparison-amc-paimon
  WAREHOUSE_BUCKET: streaming-comparison-amc-warehouse
  NODE_AZ: eu-west-1a
  TF_DIR: infra/aws
  FLUSS_SRC: ${{ github.workspace }}/.fluss-src

jobs:
  # ── EVERYTHING CHEAP AND FREE, BEFORE ANY AWS RESOURCE EXISTS ───────────────
  # Three runs failed today at roughly $5 each, all on bugs found only AFTER ~20
  # minutes of cluster build. Every one of them was catchable here, for nothing:
  #   metadata.name: pipeline_latency        -> offline manifest pre-flight
  #   Forbidden Flink config key: cluster-id -> real webhook on a kind cluster
  #   invalid Flink SQL in the gold jobs     -> not yet covered; see the TODO below
  # The deploy job does not start unless this passes, so a bad manifest costs a few
  # minutes of free runner time instead of a cluster.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests — offline (YAML, RFC1123 names, duplicate keys, envsubst traps)
        id: manifests
        continue-on-error: true
        run: ./infra/aws/scripts/preflight-manifests.sh

      - name: Shell — syntax
        id: shell
        continue-on-error: true
        run: |
          rc=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || { echo "  FAIL $f"; rc=1; }; done
          exit $rc

      - name: Python — syntax
        id: python
        continue-on-error: true
        run: |
          rc=0
          for f in $(git ls-files 'jobs/**/*.py' 'generators/*.py'); do
            python3 -c "import ast,sys;ast.parse(open(sys.argv[1]).read())" "$f" || { echo "  FAIL $f"; rc=1; }
          done
          exit $rc

      # The run job installs terraform via this action; validate needs it too, or the
      # step dies with `terraform: command not found` — which is exactly what happened
      # on the gate's first live use, and it MASKED the kind webhook check behind it.
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_wrapper: false }

      - name: Terraform — fmt + validate
        id: terraform
        continue-on-error: true
        working-directory: infra/aws
        run: |
          terraform fmt -check -recursive || echo "  (fmt drift — not fatal)"
          terraform init -backend=false -input=false
          terraform validate

      # The one that needed a live apiserver. kind gives us real admission webhooks
      # for free — this is what would have caught `kubernetes.cluster-id`.
      # continue-on-error on the cheap steps so ONE failure does not hide the others —
      # the whole point of this job is to surface everything in a single free pass. The
      # gate step at the end is what actually fails the job.
      # Compiles the Flink SQL against a throwaway local Flink with a filesystem Paimon
      # warehouse. Two of 2026-08-27's failures were planning errors that only showed up
      # ~25 minutes into a run and presented as a silently MISSING JOB. Needs no Kafka,
      # no S3, no AWS — planning happens before submission. Asserts every job file
      # produces a job, because "some jobs submitted" is exactly what the bad run looked
      # like. Uses ECR images, so it runs after the AWS creds step.
      - name: Flink SQL — compile locally
        id: flinksql
        continue-on-error: true
        run: ./infra/aws/scripts/validate-flink-sql.sh

      - name: Manifests — real admission webhooks (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: manifest-validate
          wait: 120s
      - name: Manifests — server dry-run against webhooks
        id: webhooks
        continue-on-error: true
        run: KIND_CLUSTER=manifest-validate KEEP_KIND=1 ./infra/aws/scripts/validate-against-kind.sh

      # THE GATE. Every check above runs to completion so one failure cannot hide the
      # rest — same discipline as validate-run.sh: report everything in one pass. This
      # step is what fails the job, and `run` needs: validate, so a red result here
      # means terraform apply never starts and the run costs nothing.
      - name: Gate — fail if any check failed
        run: |
          fail=0
          for c in "manifests:${{ steps.manifests.outcome }}" \
                   "shell:${{ steps.shell.outcome }}" \
                   "python:${{ steps.python.outcome }}" \
                   "terraform:${{ steps.terraform.outcome }}" \
                   "webhooks:${{ steps.webhooks.outcome }}" \\
                   "flink-sql:${{ steps.flinksql.outcome }}"; do
            n="${c%%:*}"; o="${c##*:}"
            if [ "$o" = "success" ]; then echo "  PASS  $n"; else echo "  FAIL  $n ($o)"; fail=1; fi
          done
          [ "$fail" = 0 ] || { echo; echo "validation failed — no AWS resource was created"; exit 1; }
          echo; echo "all pre-deploy checks passed"

  run:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 165          # soft cap; EventBridge is the hard 2.5h cutoff
    steps:
      - uses: actions/checkout@v4

      # FIRST, before anything is provisioned. An invalid manifest was previously only
      # discovered by applying it to a live cluster — ~25 minutes and a cluster's worth
      # of money in. `metadata.name: pipeline_latency` (illegal '_') burned a deploy
      # exactly that way, and it is catchable here in under a second, for free.
      # Runs before OIDC on purpose: it needs no credentials and no AWS at all.
      - name: Pre-flight — validate manifests
        run: ./infra/aws/scripts/preflight-manifests.sh

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::167217327348:role/streaming-comparison-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Set run id
        run: echo "RUN_ID=${{ inputs.run_id }}" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3

      # Upload the kill-switch source BEFORE apply, so the 2.5h EventBridge teardown
      # has its config even if apply fails and we leave the cluster up (destroy_mode).
      - name: Upload teardown bundle (kill-switch source)
        working-directory: ${{ env.TF_DIR }}
        run: |
          zip -qr /tmp/eks-run.zip . -x '.terraform/*'
          aws s3 cp /tmp/eks-run.zip "s3://${WAREHOUSE_BUCKET}/teardown/eks-run.zip"

      - name: Terraform apply (run)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false \
            -var "run_id=${RUN_ID}" -var "teardown_after_minutes=150"
          echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"
          echo "WORKLOAD_ROLE_ARN=$(terraform output -raw workload_role_arn)" >> "$GITHUB_ENV"
          echo "KARPENTER_NODE_ROLE=$(terraform output -raw karpenter_node_role_name)" >> "$GITHUB_ENV"
          echo "KARPENTER_CONTROLLER_ROLE=$(terraform output -raw karpenter_controller_role_arn)" >> "$GITHUB_ENV"
          echo "KARPENTER_QUEUE=$(terraform output -raw karpenter_queue_name)" >> "$GITHUB_ENV"
          echo "EFS_ID=$(terraform output -raw efs_id)" >> "$GITHUB_ENV"
          echo "DELTA_LOGSTORE_TABLE=$(terraform output -raw delta_logstore_table)" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"

      # No skip_build input. The workflow works it out: each image is tagged with a
      # content hash of its build inputs, so "is ECR's image the image these sources
      # build?" is an equality test, not a judgment call. Build what is stale, reuse
      # what is not. This is Docker's layer cache one level up, at the whole image.
      #
      # skip_build used to be a manual flag, and on 2026-08-27 it silently reused images
      # pushed 29 SECONDS before the commit that added kafka-python — three runs
      # inherited them and the Spark latency emit failed all day with "No module named
      # 'kafka'". A flag that means "trust me" was the wrong shape for this.
      - name: Images — build only what changed
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          NEED=""
          while read -r img h df ctx; do
            [ -z "$img" ] && continue
            MAN=$(aws ecr batch-get-image --region "$AWS_REGION" --repository-name "$PROJECT/$img" \
                    --image-ids imageTag="$h" --query 'images[0].imageManifest' --output text 2>/dev/null || true)
            if [ -n "$MAN" ] && [ "$MAN" != "None" ]; then
              # Reused — but :latest must POINT AT this image. Otherwise a revert to an
              # older hash leaves :latest on the newer build and the manifests, which
              # reference :latest, silently run the wrong thing. Re-tagging is a
              # metadata-only call: no rebuild, no layer upload.
              aws ecr put-image --region "$AWS_REGION" --repository-name "$PROJECT/$img" \
                --image-tag latest --image-manifest "$MAN" >/dev/null 2>&1 || true
              echo "  reuse   $img ($h)"
            else
              echo "  build   $img ($h)"
              NEED="$NEED $img"
            fi
          done < <(./infra/aws/scripts/image-hashes.sh)

          if [ -z "$NEED" ]; then echo "all images current — nothing to build"; exit 0; fi

          # Fluss images are built from source; only pay for the clone if one is stale.
          case "$NEED" in
            *fluss*) git clone --depth 1 https://github.com/apache/fluss "$FLUSS_SRC" || true
                     FLUSS_SRC="$FLUSS_SRC" docker/fluss/build-fluss.sh ;;
          esac

          while read -r img h df ctx; do
            case " $NEED " in *" $img "*) ;; *) continue ;; esac
            echo "== building $img =="
            docker build -t "$ECR_REGISTRY/$PROJECT/$img:latest" -t "$ECR_REGISTRY/$PROJECT/$img:$h" -f "$df" "$ctx"
            docker push "$ECR_REGISTRY/$PROJECT/$img:latest"
            docker push "$ECR_REGISTRY/$PROJECT/$img:$h"
          done < <(./infra/aws/scripts/image-hashes.sh)

      - name: Kubeconfig + operators
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter -n kube-system \
            --set "settings.clusterName=${CLUSTER_NAME}" --set "settings.interruptionQueue=${KARPENTER_QUEUE}" \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${KARPENTER_CONTROLLER_ROLE}" --wait
          helm repo add jetstack https://charts.jetstack.io && helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add spark-operator https://kubeflow.github.io/spark-operator
          # Flink operator: Apache archive HTTP repo (version in URL; OCI ref is not a valid chart)
          helm repo add flink-operator https://archive.apache.org/dist/flink/flink-kubernetes-operator-1.13.0/
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --set crds.enabled=true --wait
          # Strimzi: use the official install bundle (CRDs + RBAC + operator). The
          # strimzi.io/charts helm chart ships NO CRDs, so Kafka/KafkaNodePool kinds
          # were missing. Server-side apply handles the large CRD annotations.
          kubectl create namespace kafka --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -f 'https://strimzi.io/install/latest?namespace=kafka'
          kubectl -n kafka rollout status deploy/strimzi-cluster-operator --timeout=300s
          # The operator's REST client timeout defaults to 10s (verified in the chart's
          # conf/flink-conf.yaml). Under load a JobManager takes longer than that to
          # answer, the SessionObserver logs "REST service in session cluster timed out",
          # and the operator RECREATES a JM that was perfectly healthy — killing every
          # job on it. Raising these stops the operator mistaking slow for dead; HA in
          # 70-/92-flink-*.yaml is what makes a restart survivable if it happens anyway.
          cat > /tmp/flink-operator-values.yaml <<'YAML'
          defaultConfiguration:
            create: true
            append: true
            flink-conf.yaml: |+
              kubernetes.operator.flink.client.timeout: 60 s
              kubernetes.operator.observer.rest-ready.delay: 30 s
              kubernetes.operator.observer.progress-check.interval: 30 s
              kubernetes.operator.deployment.readiness.timeout: 10 min
          YAML
          helm upgrade --install flink-operator flink-operator/flink-kubernetes-operator -n flink --create-namespace --wait \
            -f /tmp/flink-operator-values.yaml
          # jobNamespaces MUST include spark: the chart default watches `default`
          # only, so SparkApplications in the spark ns are silently ignored
          # (status <none>, no driver pods, no events).
          helm upgrade --install spark-operator spark-operator/spark-operator -n spark --create-namespace --wait \
            --set 'spark.jobNamespaces={spark}'
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring --create-namespace --wait

      # A run must start from an empty lake or it is not a clean benchmark: stale
      # tables carry the PREVIOUS build's schema and table properties, and Delta /
      # Paimon both refuse (or silently ignore) a changed definition on an existing
      # table — that cost two separate debugging sessions. Stale Spark/Flink
      # checkpoints are worse: they resume at offsets from an older Kafka whose
      # topic has been recreated, so the pipelines consume nothing and commit empty
      # batches forever while looking perfectly healthy.
      # SURGICAL: only the pipeline's own output prefixes. tfstate/ and teardown/
      # live in the same warehouse bucket and must survive.
      - name: Clean lake (tables + checkpoints)
        if: ${{ inputs.clean_lake }}
        run: |
          for p in delta iceberg hudi _chk; do
            echo "wiping s3://$WAREHOUSE_BUCKET/$p/"
            aws s3 rm "s3://$WAREHOUSE_BUCKET/$p/" --recursive --only-show-errors || true
          done
          for p in paimon fluss _flink_chk; do
            echo "wiping s3://$PAIMON_BUCKET/$p/"
            aws s3 rm "s3://$PAIMON_BUCKET/$p/" --recursive --only-show-errors || true
          done
          # Guard: these must still be here afterwards.
          for keep in tfstate teardown; do
            aws s3 ls "s3://$WAREHOUSE_BUCKET/$keep/" >/dev/null 2>&1 \
              && echo "  OK preserved: $keep/" \
              || { echo "FATAL: $keep/ missing after clean — aborting"; exit 1; }
          done
          # Glue holds the Iceberg table definitions; drop them so the new schema applies.
          for db in bronze silver gold; do
            for t in $(aws glue get-tables --database-name "$db" --query 'TableList[].Name' --output text 2>/dev/null); do
              aws glue delete-table --database-name "$db" --name "$t" 2>/dev/null && echo "  dropped glue $db.$t" || true
            done
          done

      - name: Guard — wire_format must be implemented
        run: |
          if [ "${{ inputs.wire_format }}" = "avro" ]; then
            echo "avro is not implemented yet: it needs a Schema Registry (Apicurio), a"
            echo "Debezium converter swap, and Avro-capable consumers (Spark needs ABRiS)."
            echo "See AWS_OBJECTIVES.md Objective 5 and the deploy to-do list."
            exit 1
          fi

      - name: Render + apply manifests
        run: |
          export TRADES_PER_SEC="${{ inputs.trades_per_sec }}"
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          # paimon-s3 needs static keys (no IRSA). Read the scoped IAM user's key from
          # SSM (created by bootstrap) → exported for envsubst into the Paimon manifests.
          # Never in the repo/GitHub; lives in SSM + the ephemeral cluster specs.
          export S3_ACCESS_KEY="$(aws ssm get-parameter --name /${PROJECT}/paimon-s3/access-key-id --with-decryption --query Parameter.Value --output text)"
          export S3_SECRET_KEY="$(aws ssm get-parameter --name /${PROJECT}/paimon-s3/secret-access-key --with-decryption --query Parameter.Value --output text)"
          # source configmaps from the repo files
          kubectl create ns streaming --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n streaming create configmap pg-init --from-file=infra/postgres/init-appdb.sql --dry-run=client -o yaml | kubectl apply -f -
          # generator source (lean image, source mounted at /app) — same ConfigMap pattern as Spark jobs
          kubectl -n streaming create configmap generator-src \
            --from-file=generators/common.py \
            --from-file=generators/gen_trades.py \
            --from-file=generators/gen_accounts.py \
            --dry-run=client -o yaml | kubectl apply -f -
          # ECR push secret for the Strimzi KafkaConnect (Debezium) in-cluster build:
          # the node role only has ECR pull, so the build pod needs push creds. ECR
          # token is valid ~12h — ample for an ephemeral run.
          kubectl create ns kafka --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n kafka create secret docker-registry ecr-push \
            --docker-server="${ECR_REGISTRY}" --docker-username=AWS \
            --docker-password="$(aws ecr get-login-password --region "$AWS_REGION")" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n flink create ns flink --dry-run=client -o yaml 2>/dev/null || true
          kubectl -n flink create configmap fluss-sql  --from-file=jobs/flink-fluss/  --dry-run=client -o yaml | kubectl apply -f - || true
          kubectl -n flink create configmap paimon-sql --from-file=jobs/flink-paimon/ --dry-run=client -o yaml | kubectl apply -f - || true
          # Spark jobs + shared module → ConfigMaps (mounted at /opt/jobs, /opt/shared)
          kubectl create ns spark --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n spark create configmap spark-iceberg-jobs --from-file=jobs/spark-iceberg/ --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n spark create configmap spark-delta-jobs   --from-file=jobs/spark-delta/   --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n spark create configmap spark-hudi-jobs    --from-file=jobs/spark-hudi/    --dry-run=client -o yaml | kubectl apply -f -
          # WHOLE DIRECTORY, not a hand-maintained file list. The list form silently
          # omitted jobs/_shared/scd2.py when the SCD2 work landed, and every Spark
          # silver_accounts job imports it — all three would have died on AWS with
          # ModuleNotFoundError while the manifests applied cleanly. kubectl skips
          # subdirectories, so __pycache__ is not picked up.
          # tests/check_configmaps.py now fails the build if a job imports a shared
          # module that is not shipped.
          kubectl -n spark create configmap spark-shared \
            --from-file=jobs/_shared/ \
            --dry-run=client -o yaml | kubectl apply -f -
          # PHASE 0 — every ${VAR} the manifests reference must be SET and non-empty.
          # envsubst does not fail on an unset variable, it substitutes EMPTY — which
          # yields a manifest that is syntactically fine and semantically wrong.
          # COMMENT LINES ARE SKIPPED: 92-flink-paimon.yaml has a comment mentioning
          # ${FLINK_CHECKPOINT_BASE} (explaining DEPLOY_LOG #27), which is not a real
          # substitution and blocked a perfectly good deploy the first time this ran. In
          # validation this produced `volumeHandle: ""` and a rejected PersistentVolume;
          # in a real apply it would create something subtly broken instead.
          MISSING=""
          for v in $(grep -rhv '^[[:space:]]*#' infra/aws/k8s/*.yaml | grep -oE '\$\{[A-Z_][A-Z0-9_]*\}' | tr -d '${}' | sort -u); do
            [ -n "${!v:-}" ] || MISSING="$MISSING $v"
          done
          [ -z "$MISSING" ] || { echo "UNSET manifest variables:$MISSING"; echo "envsubst would blank these — refusing to apply"; exit 1; }
          echo "== all manifest variables are set =="

          # PHASE 1 — server dry-run EVERYTHING first, applying nothing. Admission
          # webhooks (the Flink operator's, Strimzi's) reject config the offline
          # pre-flight cannot see: `Forbidden Flink config key: kubernetes.cluster-id`
          # got through pre-flight and was only caught at apply time — after 70-*.yaml
          # had already half-applied, leaving a submitter Job with no cluster and every
          # manifest from 80-* onward never applied at all.
          # Dry-running first means a rejection costs seconds and leaves NOTHING
          # half-created. --validate=false skips openapi download, not the webhooks.
          echo "== phase 1: server dry-run (no changes) =="
          DRYFAIL=0
          for f in $(ls infra/aws/k8s/*.yaml | sort); do
            case "$(basename "$f")" in 96-alerts.yaml) R=$(kubectl apply --dry-run=server -f "$f" 2>&1) ;;
                                       *)              R=$(envsubst < "$f" | kubectl apply --dry-run=server -f - 2>&1) ;; esac
            # An "already exists"/immutable complaint on a re-apply is not a rejection.
            if [ $? -ne 0 ] && ! echo "$R" | grep -qiE 'already exists|field is immutable'; then
              echo "  REJECTED $(basename "$f"):"; echo "$R" | sed 's/^/      /'; DRYFAIL=1
            fi
          done
          [ "$DRYFAIL" = 0 ] || { echo "manifests rejected by admission — nothing applied"; exit 1; }
          echo "== phase 2: apply =="
          for f in $(ls infra/aws/k8s/*.yaml | sort); do
            # 96-alerts.yaml is applied WITHOUT envsubst. Prometheus annotations use Go
            # templating ({{ $labels.pod }}, {{ $value }}), and envsubst treats
            # $labels/$value as unset shell variables and substitutes EMPTY — so every
            # alert would load with a meaningless message, or fail to load at all,
            # silently. It has no ${...} placeholders, so it needs no substitution.
            case "$(basename "$f")" in
              96-alerts.yaml) kubectl apply -f "$f" ;;
              *)              envsubst < "$f" | kubectl apply -f - ;;
            esac
          done
          # Apply ONLY the ConfigMap wrapper — the raw dashboard .json has no
          # apiVersion/kind and kubectl cannot apply it. This used to be
          # `apply -f <dir> || true`, which failed silently every run and is why no
          # dashboard was ever loaded. No `|| true`: a broken dashboard should be loud.
          kubectl apply -f infra/aws/k8s/grafana/dashboard-configmap.yaml

      - name: Run for ${{ inputs.run_minutes }} min (live Grafana via port-forward)
        run: |
          echo "Cluster up. Grafana: kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80"
          sleep "$(( ${{ inputs.run_minutes }} * 60 ))"

      # The OIDC-assumed creds from the start of the job live ~1h; after a 120-min
      # run window they are EXPIRED, so the snapshot/destroy AWS calls fail with
      # RequestExpired and the cluster is left running (seen 2026-08-25; only the
      # kill-switch saved the run). GitHub's OIDC id-token is valid for the whole
      # job, so re-assuming here is free and gives fresh creds for teardown.
      - name: Re-assume deploy role (fresh creds for snapshot + teardown)
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::167217327348:role/streaming-comparison-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Drain before measuring. With the generator still running, gold trails silver by
      # whatever is in flight and bronze trails the Kafka end offset by the consumer lag,
      # so every correctness figure taken mid-flight shows a shortfall indistinguishable
      # from real data loss. QUIESCED is threaded into the snapshot so the recorded
      # numbers always say whether they were taken caught-up or mid-flight.
      - name: Quiesce (stop load, drain to zero lag)
        if: always()
        id: quiesce
        continue-on-error: true
        run: infra/aws/scripts/quiesce-run.sh

      # Delta and Paimon write to S3 without touching Glue, so Athena cannot see them
      # even though the data is there (only the Spark/Iceberg jobs self-register).
      # Runs AFTER the load window so the tables and their metadata actually exist.
      - name: Register Delta + Paimon tables in Glue (Athena visibility)
        if: always()
        run: infra/aws/scripts/register-glue-tables.sh

      - name: Snapshot correctness + latency to S3
        if: always()
        run: |
          # latency Parquet is already flushed by the exporter; run the count-reconciliation
          # (Athena) and write results next to it. See infra/aws/README.md.
          # Partitioned by wire_format so the JSON and Avro result sets (Objective 5)
          # stay distinguishable and directly comparable. Only ever compare runs that
          # differ in wire_format alone — same rate, duration, cluster size.
          export RUN_ID WIRE_FORMAT="${{ inputs.wire_format }}"
          export TRADES_PER_SEC="${{ inputs.trades_per_sec }}" RUN_MINUTES="${{ inputs.run_minutes }}"
          # invariants.csv / correctness.csv are only readable as correctness if the
          # pipelines were caught up when they were taken. Record which it was.
          export QUIESCED="${{ steps.quiesce.outcome == 'success' && 'true' || 'false' }}"
          infra/aws/scripts/snapshot-results.sh

      # Collect BEFORE destroy. destroy_mode is `always` now, so this is the only
      # chance to keep what makes a failed run debuggable — every bug found on the
      # first live run came from a log or an API listing that dies with the cluster.
      - name: Collect diagnostics (pre-destroy)
        if: always()
        continue-on-error: true
        run: KUBECTL=kubectl ./infra/aws/scripts/collect-diagnostics.sh diagnostics

      - name: Upload diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 14
          if-no-files-found: warn

      # Teardown policy (the 2.5h EventBridge kill-switch ALWAYS backstops):
      #   on-success → destroy only if the whole run succeeded (keeps a failed
      #                cluster up for debugging + incremental re-apply).
      #   never      → never destroy here; rely on the 2.5h kill-switch.
      #   always     → destroy on success, failure AND cancellation. DEFAULT, because
      #                keeping a failed cluster for debugging cost two idle clusters in
      #                one day. The diagnostics bundle uploaded just above is what makes
      #                that safe: the logs and API listings that made those failures
      #                debuggable now outlive the cluster.
      - name: Terraform destroy
        # always() matters as much as destroy_mode here. Without it a CANCELLED run
        # skips this step entirely and the cluster bills until the 2.5h kill switch —
        # which is what happened on 2026-08-27 and needed a manual teardown workflow.
        # With always() wrapping it, `destroy_mode: always` means always: success,
        # failure, and cancellation alike.
        if: ${{ always() && (inputs.destroy_mode == 'always' || (inputs.destroy_mode == 'on-success' && success())) }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          CN="sc-${RUN_ID}"
          # Destroy FIRST: deleting the EKS cluster kills Karpenter. Terminating EC2
          # while the control plane is alive makes Karpenter launch replacements
          # (seen live 2026-08-25). Karpenter nodes are NOT in tf state, so leftovers
          # are cleaned up AFTER the destroy.
          # An interrupted destroy (timeout, expired creds, killed shell) leaves the
          # DynamoDB state lock HELD, and every later attempt dies with "Error
          # acquiring the state lock" while the steps after it still report success.
          # That silently stranded a VPC + EIP twice. Clear it, then destroy.
          LID=$(terraform plan -refresh=false -lock-timeout=0s \
                  -var "run_id=${RUN_ID}" -var "teardown_after_minutes=150" 2>&1 \
                | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' | head -1 || true)
          [ -n "$LID" ] && terraform force-unlock -force "$LID" || true
            # PHASE 1 — destroy ONLY the EKS cluster. That kills Karpenter, so the nodes
            # it launched stop being replaced. Running the FULL destroy here instead is
            # what cost ~13 minutes on every teardown: Terraform reaches the node
            # security group, finds ENIs still attached to Karpenter instances that are
            # NOT in its state, and retries ~15 minutes for a detach that cannot happen —
            # because the step that terminates those instances is queued BEHIND the
            # destroy it has to unblock. Seen live 2026-08-27: EKS already deleted, 2
            # instances still running, 4 ENIs held, a full cluster still billing.
            terraform destroy -target=module.eks -auto-approve -input=false -lock-timeout=300s \
              -var "run_id=${RUN_ID}" -var "teardown_after_minutes=150" || \
              echo "targeted EKS destroy failed — continuing; the sweep below still runs"

            # PHASE 2 — terminate the orphans NOW, in the window between "control plane
            # gone" and "Terraform needs the security group". Karpenter is dead, so they
            # stay dead. Same three moves as before, reordered so this one is not trapped
            # behind the destroy it exists to unblock.
            IDS=$(aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=tag:kubernetes.io/cluster/$CN,Values=owned" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'Reservations[].Instances[].InstanceId' --output text)
            if [ -n "$IDS" ]; then
              echo "terminating orphaned Karpenter nodes: $IDS"
              aws ec2 terminate-instances --region "$AWS_REGION" --instance-ids $IDS >/dev/null
              aws ec2 wait instance-terminated --region "$AWS_REGION" --instance-ids $IDS || true
            fi
            for eni in $(aws ec2 describe-network-interfaces --region "$AWS_REGION" \
              --filters "Name=description,Values=aws-K8S-*" "Name=status,Values=available" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text); do
              aws ec2 delete-network-interface --region "$AWS_REGION" --network-interface-id "$eni" || true
            done

            # PHASE 3 — everything else. The security group and VPC now delete promptly.
            terraform destroy -auto-approve -input=false -lock-timeout=300s \
              -var "run_id=${RUN_ID}" -var "teardown_after_minutes=150" || \
              echo "destroy pass failed — sweeping blockers, then retrying"
          # Terminate leftover cluster EC2 (Karpenter is dead now; they stay dead)
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:kubernetes.io/cluster/$CN,Values=owned" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$IDS" ]; then aws ec2 terminate-instances --region "$AWS_REGION" --instance-ids $IDS; aws ec2 wait instance-terminated --region "$AWS_REGION" --instance-ids $IDS || true; fi
          # Their CNI ENIs linger 'available' and block subnet/SG deletion
          for eni in $(aws ec2 describe-network-interfaces --region "$AWS_REGION" \
            --filters "Name=description,Values=aws-K8S-*" "Name=status,Values=available" \
            --query 'NetworkInterfaces[].NetworkInterfaceId' --output text); do
            aws ec2 delete-network-interface --region "$AWS_REGION" --network-interface-id "$eni" || true
          done
          # Second pass finishes whatever the leftovers blocked (VPC/subnet/SG)
          terraform destroy -auto-approve -input=false \
            -var "run_id=${RUN_ID}" -var "teardown_after_minutes=150" || \
            echo "destroy still failing — EventBridge kill switch will tear down at the 2.5h mark"
          # Sweep CSI-provisioned EBS orphans (PVCs; reclaimPolicy Delete, but the
          # cluster is gone before they're deleted → orphaned).
          # CSI-provisioned volumes do NOT all carry kubernetes.io/cluster/<name>: some
          # only have KubernetesCluster or ebs.csi.aws.com/cluster-name. Filtering on
          # the first key alone left 190GiB of Kafka/Postgres/Fluss volumes billing
          # after a teardown that reported success. Match every variant.
          for key in "tag:kubernetes.io/cluster/$CN" "tag:KubernetesCluster" "tag:ebs.csi.aws.com/cluster-name"; do
            case "$key" in *cluster/$CN) VAL=owned ;; *) VAL="$CN" ;; esac
            for v in $(aws ec2 describe-volumes --region "$AWS_REGION" \
                --filters "Name=$key,Values=$VAL" "Name=status,Values=available" \
                --query 'Volumes[].VolumeId' --output text); do
              aws ec2 delete-volume --region "$AWS_REGION" --volume-id "$v" || true
            done
          done
          # Sweep EKS control-plane log groups. EKS auto-creates /aws/eks/$CN/cluster
          # when control-plane logging is on; an interrupted/forced destroy can leave it
          # behind and out of state, and the NEXT apply then fails CreateLogGroup with
          # ResourceAlreadyExistsException (shared run_id=iter state).
          for lg in $(aws logs describe-log-groups --region "$AWS_REGION" \
            --log-group-name-prefix "/aws/eks/$CN/" --query 'logGroups[].logGroupName' --output text); do
            aws logs delete-log-group --region "$AWS_REGION" --log-group-name "$lg" || true
          done

      - name: Teardown skipped — cluster left running
        if: ${{ inputs.destroy_mode != 'always' && !success() }}
        run: |
          echo "Run did not fully succeed and destroy_mode=${{ inputs.destroy_mode }}."
          echo "Cluster '${{ inputs.run_id }}' LEFT RUNNING for debugging / incremental re-apply."
          echo "It will be torn down by the EventBridge kill-switch ~2.5h after apply."
          echo "Manual teardown: re-run this workflow with destroy_mode=always."
